<body>
<canvas id="scene" role="img" aria-label="Animated basketball half court at night, two players playing one-on-one"></canvas>
<div class="hud" id="hud">
  <div class="title">
    <h1 class="brand">Half Court</h1>
    <span class="clock" id="clock">--:--</span>
  </div>
  <div class="score" id="score" aria-live="polite"></div>
  <div class="dock">
    <section class="panel" id="log" hidden>
      <p class="stats"><b id="stEvents">0</b> events. <b id="stDistinct">0</b> distinct. <b id="stShots">0</b> shots, <b id="stMakes">0</b> made</p>
      <ol id="logList"></ol>
      <p class="foot">Seeded from <span id="seed"></span>. Tap the scene to hide this</p>
    </section>
    <button type="button" id="logBtn" class="icon" aria-expanded="false" aria-controls="log" aria-label="Open log" title="Log (L)"><svg viewBox="0 0 7 7" width="16" height="16" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="M0 0h5v1H0zM0 1h1v1H0zM4 1h2v1H4zM0 2h1v1H0zM6 2h1v1H6zM0 3h1v1H0zM2 3h3v1H2zM6 3h1v1H6zM0 4h1v1H0zM6 4h1v1H6zM0 5h1v1H0zM2 5h3v1H2zM6 5h1v1H6zM0 6h7v1H0z"/></svg></button>
  </div>
</div>
<script src="assets/js/main.js" defer></script>
<script src="../assets/js/scene-ui.js" data-scene="basketball-court" data-text="Two players, one hoop, and a game of one-on-one that never plays the same way twice. This game was seeded at {seed}." defer></script>
</body>
