<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel City</title>
<meta name="description" content="A pixel-art night city seen from a rooftop. Every event is generated on the fly, so the scene never loops.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Night City">
<meta property="og:title" content="Pixel City | Night City">
<meta property="og:description" content="A pixel-art night city seen from a rooftop. Every event is generated on the fly, so the scene never loops.">
<meta property="og:url" content="https://anistark.github.io/nightcity/pixel-city/">
<meta property="og:image" content="https://anistark.github.io/nightcity/pixel-city/assets/images/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Pixel City: a pixel-art night skyline with neon signs and lit windows">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://anistark.github.io/nightcity/pixel-city/assets/images/og.jpg">
<meta name="twitter:creator" content="@kranirudha">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap">
<link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="../assets/css/scene-ui.css">
</head>
<body>
<canvas id="scene" role="img" aria-label="Animated pixel-art night city seen from a rooftop"></canvas>
<div class="hud" id="hud">
  <div class="title">
    <h1 class="brand">Pixel City</h1>
    <span class="clock" id="clock">--:--</span>
  </div>
  <div class="dock">
    <section class="panel" id="log" hidden>
      <p class="stats"><b id="stEvents">0</b> events · <b id="stDistinct">0</b> distinct · <b id="stLights">0</b> lights switched</p>
      <ol id="logList"></ol>
      <p class="foot">Seeded from <span id="seed"></span> · tap the scene to hide this</p>
    </section>
    <button type="button" id="logBtn" aria-expanded="false" aria-controls="log">Log</button>
  </div>
</div>
<script src="assets/js/main.js" defer></script>
<script src="../assets/js/scene-ui.js" data-scene="pixel-city" data-text="A pixel-art night city that never plays the same way twice. Mine was seeded at {seed}." defer></script>
</body>
</html>
