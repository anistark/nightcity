<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rain Window</title>
<meta name="description" content="Slow rain on a window at night, drops joining and running down the glass in front of a city out of focus. It never runs the same way twice.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Night City">
<meta property="og:title" content="Rain Window | Night City">
<meta property="og:description" content="Slow rain on a window at night, drops joining and running down the glass in front of a city out of focus. It never runs the same way twice.">
<meta property="og:url" content="https://anistark.github.io/nightcity/rain-window/">
<meta property="og:image" content="https://anistark.github.io/nightcity/rain-window/assets/images/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Rain Window: raindrops on a window at night, with city lights blurred into soft discs behind the glass">
<meta name="twitter:card" content="summary_large_image">

</head>
<body>
<canvas id="scene" role="img" aria-label="Animated raindrops on a window at night, joining and running down the glass in front of blurred city lights"></canvas>
<div class="hud" id="hud">
  <div class="title">
    <h1 class="brand">Rain Window</h1>
    <span class="clock" id="clock">--:--</span>
  </div>
  <div class="dock">
    <section class="panel" id="log" hidden>
      <p class="stats"><b id="stLanded">0</b> drops landed. <b id="stMerges">0</b> joined. <b id="stRuns">0</b> ran</p>
      <ol id="logList"></ol>
      <p class="foot">Seeded from <span id="seed"></span>. Tap the scene to hide this</p>
    </section>
    <button type="button" id="logBtn" class="icon" aria-expanded="false" aria-controls="log" aria-label="Open log" title="Log (L)"><svg viewBox="0 0 7 7" width="16" height="16" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="M0 0h5v1H0zM0 1h1v1H0zM4 1h2v1H4zM0 2h1v1H0zM6 2h1v1H6zM0 3h1v1H0zM2 3h3v1H2zM6 3h1v1H6zM0 4h1v1H0zM6 4h1v1H6zM0 5h1v1H0zM2 5h3v1H2zM6 5h1v1H6zM0 6h7v1H0z"/></svg></button>
  </div>
</div>
<script src="assets/js/main.js" defer></script>
<script src="../assets/js/scene-ui.js" data-scene="rain-window" data-text="Rain on a window at night that never runs the same way twice. Mine was seeded at {seed}." defer></script>
</body>
</html>
